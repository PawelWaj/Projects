# LOCAL run against an Artemis broker on this machine: broker/run_local.sh passes every line below as -D, so it
# overrides the endpoints of application.properties; the connection comes from BROKER_* (set by the script from
# ARTEMIS_*, the password never in a file). Not read by the L1 tests. ASSUMPTION: local address = JNDI name
# without the 'jndi.' prefix; the mapping JNDI name -> Artemis address per environment belongs to the platform.
flow.input=amqp:queue:sampleTopic::sample-adjustment
flow.input.selector=(resource='Sample Resource') AND (eventType='approved')
out.sample-adjustment=amqp:queue:mainQueue
out.partner-engagement=amqp:queue:partnerQueue
out.sample-adjustment-error-queue=amqp:queue:errorQueue
