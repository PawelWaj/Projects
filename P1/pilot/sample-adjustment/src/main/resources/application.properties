# Production endpoints (Camel K: spec.traits.camel.properties or a mounted config). No hosts, ports or
# credentials here: HTTP hosts come from env, broker connection from the platform config.
# Durable topic subscription = subscription queue consumed by FQQN <address>::<subscription> (AGENTS.md).
camel.main.name=sample-adjustment
camel.main.routes-include-pattern=classpath:routes/*.camel.yaml
flow.input=amqp:queue:jndi.sampleTopic::sample-adjustment
# OSB message selector = broker-side filter of the subscription queue (the platform register creates it with this filter)
flow.input.selector=(resource='Sample Resource') AND (eventType='approved')
out.sample-adjustment=amqp:queue:jndi.mainQueue
out.partner-engagement=amqp:queue:jndi.partnerQueue
out.sample-adjustment-error-queue=amqp:queue:jndi.errorQueue
# broker connection (AMQP 1.0, Qpid JMS): the environment of the pod provides BROKER_URL (e.g. failover:(amqp://a:5672,
# amqp://b:5672)), BROKER_USER and BROKER_PASSWORD (Secret); broker/run_local.sh sets them for a local Artemis.
# The L1 tests override the URL with a dummy (no connection is opened). Never a value here.
camel.beans.amqpConnectionFactory=#class:org.apache.qpid.jms.JmsConnectionFactory
camel.beans.amqpConnectionFactory.remoteURI={{env:BROKER_URL}}
camel.beans.amqpConnectionFactory.username={{env:BROKER_USER:}}
camel.beans.amqpConnectionFactory.password={{env:BROKER_PASSWORD:}}
camel.component.amqp.connectionFactory=#bean:amqpConnectionFactory
