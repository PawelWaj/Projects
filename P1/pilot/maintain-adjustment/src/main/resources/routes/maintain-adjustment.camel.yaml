# Camel K route (YAML DSL) for OSB project beneficiary-engagement-change-prj, proxy maintain-adjustment.
# Implemented from FLOW_CARD.md (research pack). ids branch-*, out-* are checked by check_camelk.py and the tests.
# OSB behaviour kept:
#   - traceId = inbound traceId header, else a new UUID (fn-bea:uuid)
#   - same INFO log line as the OSB Log action (logName oracle.osb.logging.pipeline), so Splunk searches keep working
#   - payload must be JSON (OSB: nXSD translation fails otherwise -> error handler); the body is forwarded UNCHANGED
#   - two independent checks: hasPPAEngagement='true' -> PPA queue, hasGOSIEngagement='true' -> GOSI queue;
#     both, one or none (none = consumed, nothing sent)
#   - GOSI queue send retried 3x every 10 s (business service retry-count/interval), PPA queue not retried
#   - any failure -> error queue with the original body + errorCode, errorMessage, debugInfo, traceId
#     (resource and eventType are inbound headers and travel with the message)
- route:
    id: maintain-adjustment
    from:
      uri: "{{flow.input}}"
      steps:
        - setHeader:
            name: traceId
            simple: "${header.traceId} ?: ${uuid(random)}"
        - doTry:
            steps:
              - log:
                  loggingLevel: INFO
                  logName: oracle.osb.logging.pipeline
                  message: "Request Received to Project beneficiary-engagement-change-prj :: for PS maintain-adjustment from JMS contributorAgreementTopic for Resource Name: ${header.resource} event with TraceID - ${header.traceId} ::${body}"
              - bean:
                  beanType: osb.beneficiaryengagementchangeprj.maintainadjustment.OsbJson
                  method: annotate
              # --- BEGIN flow logic (from the approved FLOW_CARD.md) ---
              - choice:
                  id: branch-hasppaengagement-check
                  when:
                    - id: branch-hasppaengagement-check-ppa-path
                      simple: "${header.hasPPAEngagement} == 'true'"
                      steps:
                        - to:
                            id: out-ppa-engagement
                            uri: "{{out.ppa-engagement}}"
              - choice:
                  id: branch-hasgosiengagement-check
                  when:
                    - id: branch-hasgosiengagement-check-gosi-path
                      simple: "${header.hasGOSIEngagement} == 'true'"
                      steps:
                        - to:
                            uri: "direct:send-maintain-adjustment"
              # --- END flow logic ---
            doCatch:
              - exception:
                  - java.lang.Exception
                steps:
                  - log:
                      loggingLevel: INFO
                      logName: oracle.osb.logging.pipeline
                      message: "Error captured for Project beneficiary-engagement-change-prj :: for PS maintain-adjustment with TraceID: ${header.traceId} :: fault - ${exception.class.simpleName}: ${exception.message}"
                  - setHeader:
                      name: errorCode
                      simple: "${exception.class.simpleName}"
                  - setHeader:
                      name: errorMessage
                      simple: "${exception.message}"
                  - setHeader:
                      name: debugInfo
                      constant: "target-calling-Stage"
                  - removeHeaders:
                      pattern: "hasPPAEngagement|hasGOSIEngagement"
                  - to:
                      id: out-maintain-adjustment-error-queue
                      uri: "{{out.maintain-adjustment-error-queue}}"

# GOSI queue send with the business service retry (retry-count=3, retry-interval=10s); after the last retry the
# exception goes back to the doCatch above.
- routeConfiguration:
    id: retry-maintain-adjustment
    errorHandler:
      defaultErrorHandler:
        redeliveryPolicy:
          maximumRedeliveries: "{{retry.maintain-adjustment.count:3}}"
          redeliveryDelay: "{{retry.maintain-adjustment.delay:10000}}"
- route:
    id: send-maintain-adjustment
    routeConfigurationId: retry-maintain-adjustment
    from:
      uri: "direct:send-maintain-adjustment"
      steps:
        - to:
            id: out-maintain-adjustment
            uri: "{{out.maintain-adjustment}}"
