# Production endpoints (Camel K: spec.traits.camel.properties or a mounted config). No hosts, ports or
# credentials here: HTTP hosts come from env, broker connection from the platform config.
# Durable topic subscription = subscription queue consumed by FQQN <address>::<subscription> (AGENTS.md).
camel.main.name=maintain-adjustment
camel.main.routes-include-pattern=classpath:routes/*.camel.yaml
flow.input=amqp:queue:jndi.contributorAgreementTopic::maintain-adjustment
out.maintain-adjustment=amqp:queue:jndi.beneficiaryEngagementChangeQueue
out.ppa-engagement=amqp:queue:jndi.ppaBeneficiaryEngagementChangeQueue
out.maintain-adjustment-error-queue=amqp:queue:jndi.contributorAgreementErrorQueue
